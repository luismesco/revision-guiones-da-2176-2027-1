function lock(){clearTimeout(idle);$('app').replaceChildren();$('app').hidden=true;$('login').hidden=false;$('form').reset();$('error').textContent='';window.scrollTo(0,0);$('username').focus()}
function resetIdle(){clearTimeout(idle);if(!$('app').hidden)idle=setTimeout(lock,15*60*1000)}
['pointerdown','keydown','scroll'].forEach(e=>document.addEventListener(e,resetIdle,{passive:true}));
window.addEventListener('pagehide',()=>{if(!$('app').hidden)lock()});
function wire(){
 $('logout').onclick=lock;
 const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
 $('search').oninput=e=>{const q=norm(e.target.value.trim());let n=0;document.querySelectorAll('.student').forEach(card=>{card.hidden=!norm(card.dataset.search).includes(q);if(!card.hidden)n++});$('result-count').textContent=n+' '+(n===1?'guion':'guiones');$('empty').hidden=n!==0};
 document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const text=$(b.dataset.copy).textContent;try{await navigator.clipboard.writeText(text);$('toast').textContent='Comentario copiado';$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2400)}catch{const range=document.createRange();range.selectNodeContents($(b.dataset.copy));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);b.textContent='Seleccionado: copia el texto'}});
}
$('form').onsubmit=async e=>{e.preventDefault();$('error').textContent='';$('submit').disabled=true;$('submit').textContent='Abriendo…';try{if(!crypto.subtle)throw Error('crypto');const material=new TextEncoder().encode($('username').value.trim()+'\0'+$('password').value);const base=await crypto.subtle.importKey('raw',material,'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.data));$('app').innerHTML=new TextDecoder().decode(plain);$('form').reset();$('login').hidden=true;$('app').hidden=false;wire();resetIdle();$('logout').focus();window.scrollTo(0,0)}catch(err){$('error').textContent=crypto.subtle?'Usuario o contraseña incorrectos.':'Abre esta página mediante una conexión HTTPS.';$('password').value='';$('password').focus()}finally{$('submit').disabled=false;$('submit').textContent='Abrir revisión ↗'}};
</script></body></html>
